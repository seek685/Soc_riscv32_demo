<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>③ YOLO 后处理：argmax → sigmoid → 阈值 → 检测包</title>
<style>
  body { margin:0; background:#f4f5f7; font-family:"Microsoft YaHei",sans-serif; }
  #wrap { width:1260px; margin:16px auto; }
  canvas { background:#fff; border:1px solid #ddd; border-radius:8px; display:block; }
  button { font-size:14px; padding:6px 14px; margin-right:8px; cursor:pointer; }
  span { font-size:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1240" height="780"></canvas>
  <div id="bar" style="margin-top:10px">
    <button id="btnPlay">暂停</button>
    <button id="btnSlow">慢速</button>
    <button id="btnFast">快速</button>
    <button id="btnReset">复位</button>
    <span id="speed">当前：1 网格 / 260ms</span>
  </div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
// 演示模型：16×9 网格（真实 80×45），每格 16 通道（真实同 16）
const GW=16, GH=9, NCH=16, THRESH=64;
const GX=40, GY=140, GC=26;
const BX=540, BY=150;                 // 通道条形图
const SX=540, SY=420, SW=330, SH=170; // sigmoid 图
const PX=950, PY=140;                 // 包装配区

let scan=0, packets=[], curInfo=null, done=false;
let beat=0, playing=true, beatMs=260, acc=0, lastT=0;
let emitAnim=null; // {wordIdx, prog}

function h(x,y,c){ return ((x*31+y*17+c*13+7)%100)/100; }
function inBlob(x,y){ const dx=(x-8)/4.6, dy=(y-4)/2.3; return dx*dx+dy*dy<1; }
function cellScores(x,y){
  const s=[]; const blob=inBlob(x,y);
  for(let c=0;c<NCH;c++){
    if(blob && c===3) s.push(4+h(x,y,c)*2);        // 目标通道 logit 高
    else s.push(-1.2-h(x,y,c)*2);                  // 其余通道压低
  }
  return s;
}
function sig(s){ return 255/(1+Math.exp(-s)); }

const visited=new Set();
function step(){
  if(done) return;
  const x=scan%GW, y=Math.floor(scan/GW);
  const scores=cellScores(x,y);
  let am=0; for(let c=1;c<NCH;c++) if(scores[c]>scores[am]) am=c;
  const conf=sig(scores[am]);
  curInfo={x,y,scores,am,conf};
  visited.add(y*GW+x);
  if(conf>=THRESH){
    const L=30+h(x,y,1)*20|0, T=6+h(x,y,2)*4|0, R=30+h(x,y,3)*20|0, B=6+h(x,y,4)*4|0;
    packets.push({cls:am,x,y,conf:conf|0,L,T,R,B});
    emitAnim={prog:0};
  }
  scan++;
  if(scan>=GW*GH) done=true;
  beat++;
}

function arrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-7*Math.cos(a-0.4),y2-7*Math.sin(a-0.4));
  ctx.lineTo(x2-7*Math.cos(a+0.4),y2-7*Math.sin(a+0.4));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#222';ctx.font='bold 20px "Microsoft YaHei"';
  ctx.fillText('YOLO 后处理（post_cv3_conv2d）：每个网格 16 通道 argmax → sigmoid 查表 → 过阈值 → 打成 5-word 检测包', 30, 34);
  ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#666';
  ctx.fillText('真实网格 80×45=3600 格、CONF_THRESH=64、无 NMS 无数量上限；LTRB 回归值来自 layer7 旁路，延迟对齐后拼进包', 30, 58);

  // ===== ① 网格图 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('① 输出特征图（逐格扫描，绿=过阈值发包）', GX, GY-12);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const id=y*GW+x;
    let fill='#f2f2f2';
    if(visited.has(id)){
      const blob=inBlob(x,y);
      fill = blob ? '#8fce9b' : '#d7d7d7';
    }
    ctx.fillStyle=fill;
    ctx.fillRect(GX+x*GC, GY+y*GC, GC-2, GC-2);
  }
  if(!done){
    const x=scan%GW, y=Math.floor(scan/GW);
    ctx.strokeStyle='#d62728';ctx.lineWidth=2.5;
    ctx.strokeRect(GX+x*GC-1, GY+y*GC-1, GC, GC);
  }

  // ===== ② 通道 argmax 条形图 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('② 当前网格 16 通道打分（extrema_finder 找最大）', BX, BY-12);
  if(curInfo){
    const {scores,am}=curInfo;
    for(let c=0;c<NCH;c++){
      const v=sig(scores[c])/255;
      const bh=v*130;
      ctx.fillStyle = c===am ? '#e6a800' : '#b9c8da';
      ctx.fillRect(BX+c*20, BY+140-bh, 16, bh);
      if(c===am){ ctx.fillStyle='#8a6d00';ctx.font='10px sans-serif'; ctx.fillText('c'+c, BX+c*20+2, BY+154); }
    }
    ctx.fillStyle='#333';ctx.font='13px "Microsoft YaHei"';
    ctx.fillText('argmax → 通道 '+curInfo.am+'（类别/车牌），logit='+curInfo.scores[am].toFixed(2), BX, BY+178);
  }

  // ===== ③ sigmoid LUT =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('③ sigmoid 查表（activation_lut ROM）→ 置信度 0~255', SX, SY-12);
  // 坐标轴
  ctx.strokeStyle='#999';ctx.lineWidth=1;
  ctx.strokeRect(SX,SY,SW,SH);
  // 曲线
  ctx.strokeStyle='#2b6cb0';ctx.lineWidth=2;ctx.beginPath();
  for(let i=0;i<=100;i++){
    const s=-8+16*i/100;
    const px=SX+(s+8)/16*SW, py=SY+SH-sig(s)/255*SH;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.stroke();
  // 阈值线
  const ty=SY+SH-THRESH/255*SH;
  ctx.strokeStyle='#c05621';ctx.setLineDash([5,4]);ctx.beginPath();
  ctx.moveTo(SX,ty);ctx.lineTo(SX+SW,ty);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#c05621';ctx.font='11px "Microsoft YaHei"';
  ctx.fillText('阈值 64', SX+4, ty-5);
  // 当前点
  if(curInfo){
    const s=curInfo.scores[curInfo.am], conf=curInfo.conf;
    const px=SX+(s+8)/16*SW, py=SY+SH-conf/255*SH;
    ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle= conf>=THRESH ? '#2f9e44':'#c05621';ctx.fill();
    ctx.font='12px "Microsoft YaHei"';ctx.fillStyle='#333';
    ctx.fillText('conf='+conf.toFixed(0)+(conf>=THRESH?' ≥64 → 发包！':' <64 → 丢弃'), SX+SW-150, SY+SH-8);
  }

  // ===== ④ 检测包装配 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('④ 检测包（1+4 word，送画框/裁剪）', PX, PY-12);
  const labels=['packet','L','T','R','B'];
  for(let w=0;w<5;w++){
    ctx.fillStyle='#eef3fa';ctx.fillRect(PX,PY+w*46,240,40);
    ctx.strokeStyle='#9db8d2';ctx.strokeRect(PX,PY+w*46,240,40);
    ctx.fillStyle='#555';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText('word'+w+' = '+labels[w], PX+6, PY+w*46+24);
  }
  if(emitAnim){
    const p=packets[packets.length-1];
    const texts=[
      'cls='+p.cls+' x='+p.x+' y='+p.y+' conf='+p.conf,
      ''+p.L, ''+p.T, ''+p.R, ''+p.B
    ];
    const shown=Math.min(5, Math.floor(emitAnim.prog*5)+1);
    for(let w=0;w<shown;w++){
      ctx.fillStyle='#1d4e89';ctx.font='bold 12px monospace';
      ctx.fillText(texts[w], PX+130, PY+w*46+24);
    }
    emitAnim.prog+=0.08;
    if(emitAnim.prog>1.2) emitAnim=null;
  }
  // 包队列
  ctx.font='bold 13px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('本帧已发出 '+packets.length+' 个包：', PX, PY+258);
  const q=packets.slice(-7);
  for(let i=0;i<q.length;i++){
    const p=q[i];
    ctx.fillStyle='#2f9e44';ctx.font='11px monospace';
    ctx.fillText('cls'+p.cls+' ('+p.x+','+p.y+') cf'+p.conf+' L'+p.L+' T'+p.T+' R'+p.R+' B'+p.B, PX, PY+280+i*18);
  }

  // ===== 底部说明 =====
  ctx.fillStyle='#fafbfc';ctx.fillRect(30,650,1180,110);
  ctx.strokeStyle='#ccc';ctx.strokeRect(30,650,1180,110);
  ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#444';
  ctx.fillText('要点：除置信度阈值外没有任何过滤（无尺寸/位置/数量限制）；一个大连通目标会让几十个网格同时过阈值、全部发包。', 50, 678);
  ctx.fillText('packet 32bit = [31:24]类别通道 [23:16]网格X [15:8]网格Y [7:0]置信度；word1~4 为 layer7 回归的 L/T/R/B（9bit 有符号 ×2 = 像素距离）。', 50, 702);
  ctx.fillText('扫描进度：'+Math.min(scan,GW*GH)+'/'+GW*GH+' 网格（真实一帧 3600 格）　发出包数：'+packets.length, 50, 726);
  if(done){
    ctx.fillStyle='#2f9e44';ctx.font='bold 14px "Microsoft YaHei"';
    ctx.fillText('✔ 一帧扫描完成：车牌连通区域所有过阈网格都发了包（无 NMS，下游按 MAX_BOX_NUM=6 排队消费）', 50, 750);
  }
  ctx.font='bold 14px sans-serif';ctx.fillStyle='#222';
  ctx.fillText('beat：'+beat, 30, 60+700);
}

function loop(ts){
  if(!lastT)lastT=ts;
  const dt=ts-lastT;lastT=ts;
  if(playing&&!done){acc+=dt;while(acc>=beatMs){acc-=beatMs;step();}}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('btnPlay').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';};
document.getElementById('btnSlow').onclick=()=>{beatMs=600;document.getElementById('speed').textContent='当前：1 网格 / 600ms';};
document.getElementById('btnFast').onclick=()=>{beatMs=80;document.getElementById('speed').textContent='当前：1 网格 / 80ms';};
document.getElementById('btnReset').onclick=()=>{scan=0;packets=[];curInfo=null;done=false;beat=0;visited.clear();emitAnim=null;};
</script>
</body>
</html>
