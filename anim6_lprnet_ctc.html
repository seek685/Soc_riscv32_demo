<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>⑥ LPRNet 后处理：空间求和 → argmax → CTC 解码</title>
<style>
  body { margin:0; background:#f4f5f7; font-family:"Microsoft YaHei",sans-serif; }
  #wrap { width:1260px; margin:16px auto; }
  canvas { background:#fff; border:1px solid #ddd; border-radius:8px; display:block; }
  button { font-size:14px; padding:6px 14px; margin-right:8px; cursor:pointer; }
  span { font-size:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1240" height="820"></canvas>
  <div id="bar" style="margin-top:10px">
    <button id="btnPlay">暂停</button>
    <button id="btnSlow">慢速</button>
    <button id="btnFast">快速</button>
    <button id="btnReset">复位</button>
    <span>自动播放</span>
  </div>
</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
// 真实：L31 输出 20×5×128；20 列=时序步，5 行=空间行，128 通道=类别打分
const T=20, SR=5, NCH=128;
// 示例车牌：皖A12345（7 字符），raw 序列含 blank（_) 与相邻重复
const RAW=['_','皖','皖','A','A','1','1','_','2','3','3','_','4','4','5','5','_','_','_','_'];
// 解码规则：CTC greedy —— 去 blank(75) + 去相邻重复
function decode(raw){
  const keep=[]; let prev=null;
  for(const ch of raw){
    if(ch==='_'){ prev=null; continue; }      // blank 重置前缀
    if(ch===prev) continue;                     // 相邻重复去重
    keep.push(ch); prev=ch;
  }
  return keep;
}
const RESULT=decode(RAW); // 皖A12345

const GX=40, GY=150, GC=23;      // ① 20×5 热图
const SY=310, SC=23;             // ② 求和行
const BX=580, BY=150;            // ③ argmax 竞争区
const DX=40, DY=470, DC=46;      // ④ raw 序列 + 解码
const RX=40, RY=610;             // ⑤ 结果串

let phase, col, marksBlank, marksDup, flown, beat=0;
let playing=true, beatMs=300, acc=0, lastT=0;
function reset(){ phase=0; col=0; beat=0; marksBlank=new Set(); marksDup=new Set(); flown=0; }
reset();

// 伪随机打分：正确字符通道显著最高
function h(a,b){ return ((a*37+b*11+13)%100)/100; }
function scoresFor(t){
  // 返回 6 个候选通道的分数（演示用，真实是 128 通道 extrema_finder）
  const truth=RAW[t];
  const cands=[];
  cands.push({ch:truth==='_'?'blank(75)':truth, s: truth==='_'? 6.5+h(t,1) : 7.5+h(t,2)*2, truth:true});
  const others=['M','8','B','0','_'];
  let oi=0;
  while(cands.length<6){
    const ch=others[oi++%others.length];
    if(ch===truth) continue;
    cands.push({ch: ch==='_'?'blank(75)':ch, s: 2+h(t,cands.length)*3, truth:false});
  }
  return cands;
}

function step(){
  beat++;
  if(phase===0){            // 逐列：空间求和 + argmax
    col++;
    if(col>=T){ phase=1; }
  } else if(phase===1){     // 标 blank
    for(let t=0;t<T;t++) if(RAW[t]==='_' && !marksBlank.has(t)){ marksBlank.add(t); break; }
    if(marksBlank.size>=RAW.filter(c=>c==='_').length) phase=2;
  } else if(phase===2){     // 标相邻重复
    let prev=null, doneAll=true;
    for(let t=0;t<T;t++){
      const ch=RAW[t];
      if(ch==='_'){ prev=null; continue; }
      if(ch===prev && !marksDup.has(t)){ marksDup.add(t); doneAll=false; break; }
      prev=ch;
    }
    if(doneAll){
      // 检查是否全标完
      prev=null; let all=true;
      for(let t=0;t<T;t++){
        const ch=RAW[t];
        if(ch==='_'){ prev=null; continue; }
        if(ch===prev && !marksDup.has(t)){ all=false; }
        prev=ch;
      }
      if(all) phase=3;
    }
  } else if(phase===3){     // 幸存字符飞入结果
    if(flown<RESULT.length) flown++;
    else phase=4;
  }
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#222';ctx.font='bold 20px "Microsoft YaHei"';
  ctx.fillText('LPRNet 后处理（lprnet_post_process）：20×5×128 打分 → 空间求和 → argmax → CTC 去空去重 → 车牌字符串', 30, 34);
  ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#666';
  ctx.fillText('免分割识别：不切单个字符；20 个时序步与 7~8 个字符之间靠 CTC 规则对齐。输出是字符索引（非 ASCII），翻译由软件查表完成', 30, 58);

  // ===== ① L31 输出热图 20×5 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('① 末层输出 20列(时序)×5行(空间)，每格是 128 通道最大分（示意）', GX, GY-12);
  for(let r=0;r<SR;r++)for(let t=0;t<T;t++){
    const v = (RAW[t]!=='_' ? 0.35+0.5*h(t,r) : 0.08+0.15*h(t,r)) * (r===2?1:0.8);
    const g=Math.round(255-v*190);
    ctx.fillStyle='rgb('+g+','+Math.round(g+10)+',255)';
    ctx.fillRect(GX+t*GC, GY+r*GC, GC-2, GC-2);
  }
  if(phase===0 && col<T){
    ctx.strokeStyle='#d62728';ctx.lineWidth=2.5;
    ctx.strokeRect(GX+col*GC-1, GY-1, GC, SR*GC);
  }

  // ===== ② 空间求和行 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('② lprnet_spatial_sum：5 行按列累加 → 一维序列（等效 global context）', GX, SY-12);
  const summed = phase>0 ? T : col;
  for(let t=0;t<summed;t++){
    const strong=RAW[t]!=='_';
    ctx.fillStyle= strong ? '#8fce9b' : '#e3e3e3';
    ctx.fillRect(GX+t*SC, SY, SC-2, SC*1.6-2);
  }
  if(phase===0 && col<T){
    // 合并箭头
    ctx.strokeStyle='#888';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(GX+col*GC+GC/2, GY+SR*GC+4);ctx.lineTo(GX+col*GC+GC/2, SY-4);ctx.stroke();
  }

  // ===== ③ argmax 竞争 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('③ extrema_finder：128 通道 argmax（演示取 6 个候选）', BX, BY-12);
  const t=Math.min(col, T-1);
  const cands=scoresFor(phase===0?t:T-1);
  const showT=phase===0?t:-1;
  for(let i=0;i<cands.length;i++){
    const cd=cands[i];
    const bw=cd.s/9*300;
    ctx.fillStyle= cd.truth ? '#e6a800' : '#c9d4e2';
    ctx.fillRect(BX+90, BY+i*30, bw, 22);
    ctx.fillStyle='#333';ctx.font='12px "Microsoft YaHei"';
    ctx.fillText(cd.ch, BX, BY+i*30+16);
    if(cd.truth) ctx.fillText('← 最大，输出该通道号', BX+90+bw+8, BY+i*30+16);
  }
  ctx.font='12px "Microsoft YaHei"';ctx.fillStyle='#777';
  ctx.fillText(showT>=0?('当前时序步 t='+showT+'：'+RAW[showT]):'全部 20 步 argmax 完成', BX, BY+6*30+16);

  // ===== ④ raw 序列 + CTC 解码标记 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('④ CTC greedy 解码：raw 20 步 → 去 blank（灰叉）→ 去相邻重复（橙斜线）', DX, DY-12);
  for(let t=0;t<T;t++){
    const x=DX+t*DC;
    let fill='#eef3fa';
    if(marksBlank.has(t)) fill='#e0e0e0';
    else if(marksDup.has(t)) fill='#ffe0b2';
    else if(phase>=3) fill='#bfe3c6';
    ctx.fillStyle=fill;ctx.fillRect(x,DY,DC-4,DC-4);
    ctx.strokeStyle='#bbb';ctx.strokeRect(x,DY,DC-4,DC-4);
    ctx.fillStyle='#222';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText(RAW[t], x+DC/2-9, DY+DC/2+6);
    if(marksBlank.has(t)){
      ctx.strokeStyle='#999';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x+5,DY+5);ctx.lineTo(x+DC-9,DY+DC-9);ctx.stroke();
    } else if(marksDup.has(t)){
      ctx.strokeStyle='#e07b00';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(x+5,DY+DC-9);ctx.lineTo(x+DC-9,DY+5);ctx.stroke();
    }
  }
  ctx.font='12px "Microsoft YaHei"';ctx.fillStyle='#777';
  ctx.fillText('规则（lprnet_post_process.sv:160-218）：通道号 <76 且 ≠ blank(75) 且 ≠ 前一字符（prefix_char）才输出', DX, DY+DC+18);

  // ===== ⑤ 结果串 =====
  ctx.font='bold 14px "Microsoft YaHei"';ctx.fillStyle='#333';
  ctx.fillText('⑤ 解码结果（逐字压入邮箱 64bit 寄存器，最多 8 字符）', RX, RY-12);
  for(let i=0;i<8;i++){
    const x=RX+i*70;
    ctx.fillStyle= i<flown ? '#2f9e44' : '#f0f0f0';
    ctx.fillRect(x,RY,62,56);
    if(i<flown){
      ctx.fillStyle='#fff';ctx.font='bold 26px "Microsoft YaHei"';
      ctx.fillText(RESULT[i], x+16, RY+39);
    }
  }
  if(phase===4){
    ctx.fillStyle='#2f9e44';ctx.font='bold 16px "Microsoft YaHei"';
    ctx.fillText('✔ result_done：20 步 → '+RESULT.length+' 字符「'+RESULT.join('')+'」，送结果邮箱（见动画⑦）', RX+600, RY+36);
  }

  // 底部
  ctx.fillStyle='#fafbfc';ctx.fillRect(30,720,1180,80);
  ctx.strokeStyle='#ccc';ctx.strokeRect(30,720,1180,80);
  ctx.font='13px "Microsoft YaHei"';ctx.fillStyle='#444';
  ctx.fillText('为什么需要 CTC：网络不知道每个字符占几个时序步（车牌有 7/8 位、字符宽窄不一），它只输出"每一步最像什么"；', 50, 748);
  ctx.fillText('去 blank + 去相邻重复两条规则把 20 步冗余序列压成变长字符串，无需预先切分字符。beat：'+beat, 50, 772);
}

function loop(ts){
  if(!lastT)lastT=ts;
  const dt=ts-lastT;lastT=ts;
  if(playing&&phase<4){acc+=dt;while(acc>=beatMs){acc-=beatMs;step();}}
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('btnPlay').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';};
document.getElementById('btnSlow').onclick=()=>{beatMs=700;};
document.getElementById('btnFast').onclick=()=>{beatMs=100;};
document.getElementById('btnReset').onclick=()=>{reset();};
</script>
</body>
</html>
