<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CNN 层间流水动画 —— 三层 × PE × 权重ROM × 时序</title>
<style>
  body { margin:0; background:#f4f5f7; font-family:"Microsoft YaHei",sans-serif; }
  #wrap { width:1260px; margin:16px auto; }
  canvas { background:#ffffff; border:1px solid #ddd; border-radius:8px; display:block; }
  #bar { margin-top:10px; }
  button { font-size:14px; padding:6px 14px; margin-right:8px; cursor:pointer; }
  #speed { font-size:14px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1240" height="690"></canvas>
  <div id="bar">
    <button id="btnPlay">暂停</button>
    <button id="btnSlow">慢速</button>
    <button id="btnFast">快速</button>
    <span id="speed">当前：1 beat / 500ms（1 beat = 1 个 clk_pe 时钟周期）</span>
  </div>
</div>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// ---------- 演示参数（以 YOLO L0/L1/L2 为原型，CP 取 8 便于观察） ----------
const CP = 8;                       // CYCLE_PERIOD：每算完 1 个输出像素需要的拍数（层内时间复用）
const ROW_CELLS = 11;               // 行缓存演示长度
const WIN = 3;                      // 3x3 卷积核
const LAYERS = [
  { name:'Layer N',   sub:'3×3 卷积 · 9 个 PE · 权重 ROM 每拍换一组', delay: 0 },
  { name:'Layer N+1', sub:'结构相同 · 晚 14 拍启动（流水延迟）',      delay: 14 },
  { name:'Layer N+2', sub:'结构相同 · 再晚 14 拍',                    delay: 28 },
];

let beat = 0;          // 全局拍计数
let beatMs = 500;      // 每拍时长
let playing = true;
let acc = 0;           // 帧时间累积
let lastT = 0;
let tokens = [];       // 移动的权重/输出小圆点 {x,y,path,prog,speed,color}
let flashes = [];      // 输出闪光 {x,y,life}

const PX = [30, 440, 850];   // 三个面板的 x 起点
const PY = 150;
const CELL = 20;

function panelState(i){
  const local = beat - LAYERS[i].delay;
  if (local < 0) return {idle:true, pixel:0, t:0};
  return { idle:false, pixel:Math.floor(local/CP), t: local%CP };
}

// ---------- 绘制 ----------
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);

  // 标题
  ctx.fillStyle = '#222'; ctx.font = 'bold 20px "Microsoft YaHei"';
  ctx.fillText('行流式 CNN 加速器：三层同时工作 · 层内 9-PE 脉动阵列 · 权重 ROM 逐拍广播', 30, 34);
  ctx.font = '13px "Microsoft YaHei"'; ctx.fillStyle = '#666';
  ctx.fillText('每 CP=' + CP + ' 拍产出一个输出像素；输出立即流入下一层（不经过 DDR / 不整帧缓存）—— 这就是"层间流水"', 30, 58);

  for (let i=0;i<3;i++) drawPanel(i);
  drawTokens();
  drawWavefront();
  drawClock();
}

function drawPanel(i){
  const st = panelState(i);
  const x = PX[i], y = PY;

  // 面板标题
  ctx.font = 'bold 16px "Microsoft YaHei"'; ctx.fillStyle = '#111';
  ctx.fillText(LAYERS[i].name, x, y-58);
  ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#777';
  ctx.fillText(LAYERS[i].sub, x, y-40);

  // ---- 输入箭头 ----
  ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
  const inY = y+30;
  arrow(x-24, inY, x-2, inY, '#888');
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#555';
  ctx.fillText(i===0 ? '像素流' : '上一层输出', x-24, inY-8);

  // ---- 行缓存 + 滑窗 ----
  const gx = x+10, gy = y;
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#555';
  ctx.fillText('行缓存(input_layer) → 3×3 滑窗', gx, gy-6);
  for (let r=0;r<WIN;r++){
    for (let c=0;c<ROW_CELLS;c++){
      ctx.fillStyle = st.idle ? '#f0f0f0' : '#dce9fb';
      ctx.fillRect(gx+c*CELL, gy+r*CELL, CELL-2, CELL-2);
    }
  }
  // 滑窗位置（每 CP 拍右移一格，到底回卷 = 换行）
  const wcol = st.idle ? 0 : st.pixel % (ROW_CELLS-WIN);
  ctx.strokeStyle = st.idle ? '#bbb' : '#d62728'; ctx.lineWidth = 2.5;
  ctx.strokeRect(gx+wcol*CELL-1, gy-1, WIN*CELL, WIN*CELL);
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#d62728';
  if (!st.idle) ctx.fillText('当前窗口', gx+wcol*CELL, gy+WIN*CELL+14);

  // ---- PE 脉动链（9 个乘加器串成列） ----
  const peX = x+258, peY = y+2, peGap = 15;
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#555';
  ctx.fillText('PE列×9', peX-12, y-6);
  for (let k=0;k<9;k++){
    const cy = peY + k*peGap + 7;
    const active = !st.idle;
    ctx.beginPath();
    ctx.arc(peX, cy, 6.5, 0, Math.PI*2);
    ctx.fillStyle = active ? pulseColor('#2b6cb0') : '#cfd8e3';
    ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif';
    ctx.fillText('w'+k, peX-8, cy+3);
    if (k<8){ ctx.strokeStyle='#9db8d2'; ctx.lineWidth=1.5; arrow(peX, cy+6.5, peX, cy+peGap-6.5, '#9db8d2'); }
  }
  // 滑窗→PE 的数据箭头
  if (!st.idle) arrow(gx+(wcol+3)*CELL+2, gy+CELL*1.5, peX-10, peY+7, '#d62728');

  // ---- 权重 ROM + time_idx ----
  const rx = x+300, ry = y+2, rh = 15;
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#555';
  ctx.fillText('权重ROM', rx+6, y-6);
  for (let r=0;r<CP;r++){
    const hl = !st.idle && r===st.t;
    ctx.fillStyle = hl ? '#ffd54f' : '#efefef';
    ctx.fillRect(rx, ry+r*rh, 62, rh-2);
    ctx.fillStyle = '#555'; ctx.font = '10px sans-serif';
    ctx.fillText('t='+r+' 组', rx+4, ry+r*rh+11);
  }
  // ROM→PE 的权重令牌（每拍一个）
  if (!st.idle){
    const fromY = ry + st.t*rh + 7;
    spawnTokenOnce(i, 'w', rx, fromY, peX+9, peY+7, '#e6a800');
  }
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#b8860b';
  ctx.fillText('time_idx=' + (st.idle?'-':st.t), rx, ry+CP*rh+14);

  // ---- 累加条（跨 CP 拍的部分和累加） ----
  const ax = x+10, ay = y+98, aw = 220;
  ctx.font = '11px "Microsoft YaHei"'; ctx.fillStyle = '#555';
  ctx.fillText('output_layer：求和+bias+移位+ReLU（累加 ' + (st.idle?0:st.t+1) + '/' + CP + '）', ax, ay-5);
  ctx.strokeStyle = '#999'; ctx.strokeRect(ax, ay, aw, 13);
  ctx.fillStyle = '#6aa84f';
  ctx.fillRect(ax+1, ay+1, st.idle?0:(aw-2)*(st.t+1)/CP, 11);

  // ---- 输出点 ----
  const ox = x+252, oy = ay+6;
  ctx.beginPath(); ctx.arc(ox, oy, 7, 0, Math.PI*2);
  ctx.fillStyle = st.idle ? '#cfd8e3' : '#6aa84f'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='9px sans-serif'; ctx.fillText('out', ox-9, oy+3);

  // 输出完成 → 令牌飞向下一层
  if (!st.idle && st.t===CP-1 && i<2){
    spawnTokenOnce(i, 'out', ox+8, oy, PX[i+1]-2, PY+30, '#2f9e44');
  }
  if (!st.idle && st.t===CP-1){
    flashes.push({x:ox, y:oy, life:1});
  }

  // 闪光
  flashes = flashes.filter(f=>f.life>0);
  for (const f of flashes){
    ctx.beginPath(); ctx.arc(f.x, f.y, 7+(1-f.life)*14, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(47,158,68,'+f.life+')'; ctx.lineWidth=2; ctx.stroke();
    f.life -= 0.04;
  }

  if (st.idle){
    ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#999';
    ctx.fillText('（等待流水启动…）', gx, gy+WIN*CELL+52);
  }
}

// 令牌：防止同一拍重复生成
let spawned = {};
function spawnTokenOnce(layer, kind, x1,y1,x2,y2,color){
  const key = layer+'-'+kind+'-'+beat;
  if (spawned[key]) return;
  spawned[key] = true;
  if (Object.keys(spawned).length>200) spawned = {};
  tokens.push({x1,y1,x2,y2,prog:0,speed: kind==='w'?0.14:0.03, color});
}
function drawTokens(){
  tokens = tokens.filter(t=>t.prog<=1);
  for (const t of tokens){
    const x = t.x1+(t.x2-t.x1)*t.prog, y = t.y1+(t.y2-t.y1)*t.prog;
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle=t.color; ctx.fill();
    t.prog += t.speed;
  }
}

// ---------- 底部：行波前图（层间流水的宏观视图） ----------
function drawWavefront(){
  const bx=30, by=430, bw=1180, bh=180;
  ctx.fillStyle='#fafbfc'; ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='#ccc'; ctx.strokeRect(bx,by,bw,bh);
  ctx.font='bold 14px "Microsoft YaHei"'; ctx.fillStyle='#333';
  ctx.fillText('宏观视角：同一时刻，三层在处理同一帧的不同行（行波前）', bx+10, by+22);
  ctx.font='11px "Microsoft YaHei"'; ctx.fillStyle='#888';
  ctx.fillText('横轴 = 时间(beat)　纵轴 = 该层正在处理的输出行号', bx+10, by+40);

  const x0=bx+70, x1=bx+bw-30, y0=by+bh-24, y1=by+56;
  const maxBeat=Math.max(60, beat+2);
  const colors=['#2b6cb0','#c05621','#2f9e44'];
  for (let i=0;i<3;i++){
    const st=panelState(i);
    const row = st.idle?0:Math.floor(st.pixel/ (ROW_CELLS-WIN)); // 每行 ROW_CELLS-WIN 个窗口
    // 画到当前为止的行推进折线
    ctx.strokeStyle=colors[i]; ctx.lineWidth=2; ctx.beginPath();
    let started=false;
    for (let b=0;b<=Math.min(beat,maxBeat-2);b++){
      const local=b-LAYERS[i].delay;
      const r = local<0?0:Math.floor(Math.floor(local/CP)/(ROW_CELLS-WIN));
      const X=x0+(x1-x0)*b/(maxBeat-2), Y=y0-(y0-y1)*Math.min(r,9)/9;
      if(!started){ctx.moveTo(X,Y);started=true;}else ctx.lineTo(X,Y);
    }
    ctx.stroke();
    // 当前点
    const local=beat-LAYERS[i].delay;
    if(local>=0){
      const X=x0+(x1-x0)*beat/(maxBeat-2), Y=y0-(y0-y1)*Math.min(row,9)/9;
      ctx.beginPath();ctx.arc(X,Y,4,0,Math.PI*2);ctx.fillStyle=colors[i];ctx.fill();
    }
    ctx.fillStyle=colors[i];ctx.font='12px "Microsoft YaHei"';
    ctx.fillText(LAYERS[i].name+'：第 '+row+' 行', bx+bw-150, by+60+i*20);
  }
  // 坐标轴
  ctx.strokeStyle='#999';ctx.lineWidth=1;
  arrow(x0,y0,x1,y0,'#999'); arrow(x0,y0,x0,y1,'#999');
}

function drawClock(){
  ctx.font='bold 15px sans-serif'; ctx.fillStyle='#222';
  ctx.fillText('clk_pe beat：'+beat, 30, 660);
  ctx.font='13px "Microsoft YaHei"'; ctx.fillStyle='#555';
  ctx.fillText('黄色 = 当前拍广播的权重组（time_idx）｜绿色条 = 输出像素的累加进度，满格即发射给下一层｜金色点 = 权重流｜绿色点 = 输出像素流', 180, 660);
}

function arrow(x1,y1,x2,y2,color){
  ctx.strokeStyle=color;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-7*Math.cos(a-0.4),y2-7*Math.sin(a-0.4));
  ctx.lineTo(x2-7*Math.cos(a+0.4),y2-7*Math.sin(a+0.4));
  ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
let pulsePhase=0;
function pulseColor(base){
  // 简单脉动：透明度随帧相位变化
  return base;
}

// ---------- 主循环 ----------
function loop(ts){
  if(!lastT) lastT=ts;
  const dt=ts-lastT; lastT=ts;
  if(playing){
    acc+=dt;
    while(acc>=beatMs){ acc-=beatMs; beat++; }
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.getElementById('btnPlay').onclick=e=>{
  playing=!playing; e.target.textContent=playing?'暂停':'播放';
};
document.getElementById('btnSlow').onclick=()=>{beatMs=1000;document.getElementById('speed').textContent='当前：1 beat / 1000ms（1 beat = 1 个 clk_pe 时钟周期）';};
document.getElementById('btnFast').onclick=()=>{beatMs=200;document.getElementById('speed').textContent='当前：1 beat / 200ms（1 beat = 1 个 clk_pe 时钟周期）';};
</script>
</body>
</html>
